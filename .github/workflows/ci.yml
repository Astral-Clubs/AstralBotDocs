name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: check pages
        run: bun run check
      - name: check comments
        run: bun run check:comments
      - name: test checks
        run: bun run test
      - name: build site
        run: bun run build
      - name: validate cloudflare config
        run: bunx wrangler deploy --env production --dry-run
